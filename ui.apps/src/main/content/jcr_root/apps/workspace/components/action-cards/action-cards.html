<sly
  data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
  data-sly-call="${clientlib.css @ categories='workspace.action-cards'}"
/>

<sly data-sly-use.model="com.workspace.core.models.ActionCardsModel" />

<sly data-sly-test="${model.cards && model.cards.size > 0}">
  <section class="cmp-action-cards">
    <h2 data-sly-test="${model.title}" class="cmp-action-cards__title">
      ${model.title}
    </h2>

    <ul class="cmp-action-cards__list">
      <li data-sly-repeat.card="${model.cards}" class="cmp-action-cards__item">
        <h3 data-sly-test="${card.title}" class="cmp-action-cards__card-title">
          ${card.title}
        </h3>

        <p
          data-sly-test="${card.description}"
          class="cmp-action-cards__description"
        >
          ${card.description}
        </p>

        <div class="cmp-action-cards__actions">
          <a
            data-sly-test="${card.cta1Valid}"
            class="cmp-action-cards__link apollo-unique-id"
            href="${card.link1}"
          >
            <span class="cmp-action-cards__arrow" aria-hidden="true">→</span>
            <span>${card.linkLabel1}</span>
          </a>

          <a
            data-sly-test="${card.cta2Valid}"
            class="cmp-action-cards__link apollo-unique-id"
            href="${card.link2}"
          >
            <span class="cmp-action-cards__arrow" aria-hidden="true">→</span>
            <span>${card.linkLabel2}</span>
          </a>
        </div>
      </li>
    </ul>
  </section>
</sly>
